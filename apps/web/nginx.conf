# nginx del contenedor `web` (docker-compose.yml, perfil `app`): sirve la PWA y reenvía /api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # El DNS de Docker se consulta en cada petición: si la API se reinicia con otra IP, sigue llegando.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con hash no cambian nunca.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Lo que decide qué versión de la app se carga se revalida siempre.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Rutas de la app (/mapa, /reportar…): las resuelve React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
